# ========================================================
# CULTIVAMAIS - CONFIGURACOES GLOBAIS
# ========================================================
spring.application.name=cultivamais
server.port=8090

# --- SELETOR DE PERFIL (MUITO IMPORTANTE) ---
# Apontamento para 'application-supabase.properties'
# Antes: spring.profiles.active=dev
spring.profiles.active=supabase

# --- CONFIGURACAO DO SWAGGER / SPRINGDOC ---
springdoc.packages-to-scan=br.com.cultiva.cultivamais.controller
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha

## --- NIVEIS DE LOG ---
#logging.level.org.springdoc=DEBUG
#logging.level.org.springframework.web=DEBUG

# --- CONFIGURACOES GERAIS JPA ---
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

#spring.jpa.hibernate.ddl-auto=none
#spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false



