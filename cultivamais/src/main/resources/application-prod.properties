# Conexao com o servidor PostgreSQL local ou remoto
spring.datasource.url=jdbc:postgresql://localhost:5432/cultivamais_db
spring.datasource.username=postgres
spring.datasource.password=3.14159265
spring.datasource.driver-class-name=org.postgresql.Driver

# Dialeto especifico para PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate: Mantem as tabelas sincronizadas com as entidades Java
spring.jpa.hibernate.ddl-auto=update