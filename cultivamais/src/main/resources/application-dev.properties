# ========================================================
# PERFIL: DESENVOLVIMENTO (OFFLINE / H2 DATABASE)
# ========================================================

# Conexao: Cria um arquivo fisico na pasta ./data/ para persistir os dados
spring.datasource.url=jdbc:h2:file:./data/cultiva_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin

# Dialeto especifico para o H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hibernate: Cria as tabelas automaticamente se nao existirem
spring.jpa.hibernate.ddl-auto=update

# H2 Console: Interface para gerenciar o banco via navegador
# Acesse em: http://localhost:8090/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false